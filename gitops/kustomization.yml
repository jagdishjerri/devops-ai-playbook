apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: No global "namespace:" transformer here on purpose. Application resources
# declare "namespace: boutique" explicitly, while the ServiceMonitor and Grafana
# dashboard belong in the "monitoring" namespace. A global namespace override
# would incorrectly relocate those monitoring resources into "boutique".

resources:
  - namespace.yml
  - secrets.yml
  - k8s/rbac.yml
  - k8s/networkpolicy.yml
  - k8s/database/statefulset.yml
  - k8s/database/service.yml
  - k8s/backend/gateway.yml
  - k8s/backend/service-monitor.yml
  - k8s/backend/auth.yml
  - k8s/backend/product-service.yml
  - k8s/backend/order-service.yml
  - k8s/backend/orders.yml
  - k8s/backend/user-service.yml
  - k8s/frontend/deployment.yml
  - k8s/grafana-dashboard.yml

configMapGenerator:
  - name: boutique-db-dump
    namespace: boutique
    files:
      - k8s/database/boutique_full.sql

generatorOptions:
  disableNameSuffixHash: true
