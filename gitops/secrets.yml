# WARNING - DEMO CREDENTIALS ONLY
# These values are committed in plaintext for local/demo use. Do NOT use this
# file as-is in production. Replace it with one of:
#   - Sealed Secrets (bitnami-labs/sealed-secrets)
#   - External Secrets Operator backed by AWS Secrets Manager / SSM / Vault
